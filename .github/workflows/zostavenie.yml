name: Zostavenie SkVP

on:
  push:
    branches: [ main, 'vyvoj/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zostavenie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zostavenie:
    runs-on: windows-latest
    steps:
      - name: Stiahnuť zdrojový kód
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nainštalovať .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Určiť verziu
        id: verzia
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          "cislo=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Verzia: $v"

      - name: Vyrovnávacia pamäť – prepis hlasu (whisper.cpp)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skvp-hlas-dll
          key: skvp-hlas-d1be6fde11ac6e0407606b4e42fe72d34add8037-${{ hashFiles('nastroje/hlas/**') }}

      - name: Prepis hlasu whisper.cpp zo zdrojového kódu (overená verzia)
        # prepis diktovania bez internetu (whisper.cpp, licencia MIT): skompiluje sa z pevne určeného commitu spolu
        # s tenkou vrstvou nastroje/hlas/skvp_hlas.c; kontroluje sa, z ktorých knižníc Windows volá funkcie
        shell: pwsh
        run: |
          $verzia = "v1.9.5"
          $overenyCommit = "d1be6fde11ac6e0407606b4e42fe72d34add8037"
          $ciel = Join-Path $env:RUNNER_TEMP "skvp-hlas-dll"
          if (-not (Test-Path (Join-Path $ciel "SkvpHlas.dll"))) {
            $zdroj = Join-Path $env:RUNNER_TEMP "whisper.cpp"
            git clone --quiet --depth 1 --branch $verzia https://github.com/ggml-org/whisper.cpp $zdroj
            $commit = (git -C $zdroj rev-parse HEAD).Trim()
            if ($commit -ne $overenyCommit) {
              Write-Host "::error::whisper.cpp $verzia má commit $commit, overený je $overenyCommit"
              exit 1
            }
            $zostava = Join-Path $env:RUNNER_TEMP "skvp-hlas-build"
            cmake -S nastroje/hlas -B $zostava -A x64 "-DWHISPER_ZDROJ=$zdroj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $zostava --config Release --target SkvpHlas --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dll = Get-ChildItem $zostava -Recurse -Filter SkvpHlas.dll | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
            if (-not $dll) { Write-Host "::error::SkvpHlas.dll sa nezostavila"; exit 1 }
            New-Item -ItemType Directory -Force $ciel | Out-Null
            Copy-Item $dll.FullName (Join-Path $ciel "SkvpHlas.dll")
            Copy-Item (Join-Path $zdroj "LICENSE") (Join-Path $ciel "LICENSE-whisper.cpp.txt")
          }
          $dll = Get-Item (Join-Path $ciel "SkvpHlas.dll")
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $importy = & $dumpbin.FullName /nologo /imports $dll.FullName
          $kniznice = $importy | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1].ToLowerInvariant() } } | Sort-Object -Unique
          Write-Host "::notice::SkvpHlas.dll používa len tieto knižnice Windows: $($kniznice -join ', ')"
          $povolene = '^(kernel32\.dll|advapi32\.dll|vcruntime140(_1)?\.dll|msvcp140\.dll|api-ms-win-crt-[a-z0-9-]+\.dll)$'
          $zakazane = $kniznice | Where-Object { $_ -notmatch $povolene }
          if ($zakazane) {
            Write-Host "::error::Prepis hlasu používa nepovolené knižnice: $($zakazane -join ', ')"
            exit 1
          }
          $exporty = (& $dumpbin.FullName /nologo /exports $dll.FullName) -join "`n"
          foreach ($f in @("skvp_hlas_otvor", "skvp_hlas_prepis", "skvp_hlas_zavri")) {
            if ($exporty -notmatch $f) { Write-Host "::error::SkvpHlas.dll nemá funkciu $f"; exit 1 }
          }
          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          Write-Host "::notice::SkvpHlas.dll z whisper.cpp $verzia ($overenyCommit), SHA-256 $hash"
          New-Item -ItemType Directory -Force src/SkVP.App/Native | Out-Null
          Copy-Item $dll.FullName src/SkVP.App/Native/SkvpHlas.dll
          Copy-Item (Join-Path $ciel "LICENSE-whisper.cpp.txt") src/SkVP.App/Native/LICENSE-whisper.cpp.txt

      - name: Zostaviť program
        shell: pwsh
        run: >
          dotnet publish src/SkVP.App/SkVP.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.verzia.outputs.cislo }}
          -o publish

      - name: Samotest programu
        shell: pwsh
        run: |
          $env:SKVP_DATA_DIR = Join-Path $env:RUNNER_TEMP "skvp-samotest"
          $p = Start-Process -FilePath "publish\SkVP.exe" -ArgumentList "--samotest" -PassThru
          $null = $p.Handle
          $log = Join-Path $env:SKVP_DATA_DIR "samotest.log"
          $priebeh = Join-Path $env:SKVP_DATA_DIR "samotest_priebeh.log"
          if (-not $p.WaitForExit(480000)) {
            $p.Kill()
            Write-Host "::error::Samotest neskončil do 8 minút"
            if (Test-Path $priebeh) { Get-Content $priebeh -Tail 30 }
            exit 1
          }
          if (Test-Path $log) {
            Get-Content $log
            Get-Content $log | Where-Object { $_ -cmatch 'CHYBA' } | Select-Object -First 5 | ForEach-Object {
              $riadok = $_ -replace "`r", '' -replace '%', '%25'
              Write-Host "::error::$riadok"
            }
          } else {
            Write-Host "::error::Samotest nevytvoril záznam (kód $($p.ExitCode))"
            if (Test-Path $priebeh) { Get-Content $priebeh -Tail 30 }
          }
          if ($p.ExitCode -ne 0) {
            Write-Host ("::error::Program skončil s kódom {0} (0x{0:X8})" -f $p.ExitCode)
            exit 1
          }
          Write-Host "::notice::Samotest OK"

      - name: Uložiť výstupy samotestu (len vývojové vetvy)
        # aj po neúspešnom samoteste – záznam, snímky obrazovky a vzorové PDF pomôžu nájsť chybu
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zdroj = Join-Path $env:RUNNER_TEMP "skvp-samotest"
          $ciel = Join-Path $env:RUNNER_TEMP "vystupy"
          New-Item -ItemType Directory -Force $ciel | Out-Null
          if (Test-Path (Join-Path $zdroj "Export")) { Copy-Item (Join-Path $zdroj "Export\*") $ciel -Force }
          Copy-Item (Join-Path $zdroj "samotest.log") $ciel -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $zdroj "samotest_priebeh.log") $ciel -ErrorAction SilentlyContinue
          Set-Location $ciel
          git init -q -b vystupy
          git config user.name "SkVP zostavenie"
          git config user.email "zostavenie@users.noreply.github.com"
          git add -A
          git commit -q -m "Výstupy samotestu ${{ github.sha }}"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" vystupy

      - name: Zostaviť inštalátor
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.verzia.outputs.cislo }}" "/DSourceDir=$PWD\publish" installer\skvp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inštalátor na stiahnutie (vývojová verzia)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SkVP_Setup_${{ steps.verzia.outputs.cislo }}
          path: installer/Output/SkVP_Setup_${{ steps.verzia.outputs.cislo }}.exe
          retention-days: 14

      - name: Zverejniť novú verziu
        # vývojové vetvy sa len zostavia a otestujú, verzia sa zverejní iba z vetvy main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verzia = "${{ steps.verzia.outputs.cislo }}"
          $instalator = "installer/Output/SkVP_Setup_$verzia.exe"
          $predosla = git describe --tags --abbrev=0 --match "v*" 2>$null
          $global:LASTEXITCODE = 0
          if ($predosla) {
            $zmeny = git log --no-merges --pretty=format:"- %s" "$predosla..HEAD"
          } else {
            $zmeny = git log --no-merges --pretty=format:"- %s" -n 20
          }
          $poznamky = @(
            "## Novinky vo verzii $verzia",
            "",
            ($zmeny -join "`n"),
            "",
            "Stiahnite súbor **SkVP_Setup_$verzia.exe** a spustite ho. Nainštalovaný SkVP ponúkne ďalšie verzie sám pri spustení."
          ) -join "`n"
          Set-Content -Path notes.md -Value $poznamky -Encoding utf8
          gh release create "v$verzia" $instalator `
            --title "SkVP $verzia" `
            --notes-file notes.md `
            --latest `
            --target ${{ github.sha }}
